server.port=${PORT:8080}
server.forward-headers-strategy=native

# Database (override with env vars in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobboard?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# App settings
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-dev-only-secret-change-this}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seed-sample-jobs=${SEED_SAMPLE_JOBS:true}
